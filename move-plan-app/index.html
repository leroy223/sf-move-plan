<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move Plan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EDF1F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D171C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  /* Layout idea: a phone app. Sticky header, one scrolling column of cards, a fixed tab bar, and bottom sheets for detail. The first person is blue and the second orange, everywhere. */
  --paper:#EDF1F1; --surface:#FFFFFF; --inset:#E4EAEC; --ink:#12222B; --ink2:#43555D; --muted:#64757D; --line:#D3DCDF;
  --signal:#D9481C; --sea:#1C5CAB;
  --good:#1B7548; --good-bg:#DCEFE4; --warn:#855800; --warn-bg:#F5E7C6; --crit:#AE2A22; --crit-bg:#F6DDDA;
  --roy:#1F63B8; --cec:#C2541F; --roy-bg:#DCE8F7; --cec-bg:#F8E3D8;
  --s1:#2a78d6; --s2:#eb6834;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0D171C; --surface:#152229; --inset:#1D2D35; --ink:#E7EDEF; --ink2:#B8C6CC; --muted:#8B9CA4; --line:#2B3C45;
  --signal:#FF7B4A; --sea:#7FB5F0;
  --good:#55C48D; --good-bg:#143525; --warn:#E6B656; --warn-bg:#3A2E10; --crit:#F27D74; --crit-bg:#401C19;
  --roy:#3D84DA; --cec:#D9632E; --roy-bg:#172A42; --cec-bg:#3A2216;
  --s1:#3987e5; --s2:#d95926;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:var(--sea)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.hdr{position:sticky;top:0;z-index:20;background:var(--paper);padding:calc(var(--top) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.hdr .t{flex:1;min-width:0}
.hdr h1{font:800 20px/1.1 var(--font);letter-spacing:-.01em}
.hdr .s{font:500 12.5px var(--font);color:var(--muted);margin-top:2px}
.sync{position:relative;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:5px 12px 5px 5px;cursor:pointer}
.sync .lbl{font:700 13px var(--font)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--signal);color:#fff;font:800 11.5px/20px var(--font);text-align:center}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:800 13px var(--font);flex:none}
.av.sm{width:20px;height:20px;font-size:10.5px}
.av.p0{background:var(--roy)}.av.p1{background:var(--cec)}.av.p-1{background:var(--muted)}

main{padding:14px 14px calc(92px + var(--bot));max-width:680px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card>h2{font:800 17px/1.25 var(--font);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font:700 11.5px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.sub{color:var(--ink2);font-size:14.5px}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.tile .k{font:700 11px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.tile .v{font:700 26px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.tile .n{font-size:13px;color:var(--ink2)}
.road{height:6px;border-radius:3px;background:var(--line);position:relative;margin:4px 0 6px}
.road i{position:absolute;inset:0 auto 0 0;background:var(--signal);border-radius:3px}
.road b{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--signal);border:3px solid var(--surface)}

.chip{display:inline-block;font:800 10.5px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px 3px;border-radius:5px;background:var(--inset);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.crit{background:var(--crit-bg);color:var(--crit)}
.banner{display:flex;align-items:center;gap:12px;background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 14px}
.banner p{flex:1;font-size:14.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.link{border:0;background:none;padding:6px 0;min-height:0;color:var(--sea);font-weight:700}
.btn.danger{color:var(--crit)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.stack{display:grid;gap:10px}

.checks{list-style:none;margin:0;padding:0;display:grid}
.checks li{border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks label{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:10px 0;cursor:pointer;font-size:15.5px}
.checks input{width:22px;height:22px;margin:0;accent-color:var(--sea)}
.checks input:checked+span{color:var(--muted);text-decoration:line-through}
.checks .d{font:700 12.5px var(--mono);color:var(--ink2);margin-right:6px}
.checks .today span{background:var(--warn-bg);border-radius:4px}

.wk{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.wk>button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer}
.wk .wd{font:700 12.5px var(--mono);color:var(--ink2)}
.wk .wf{font:800 16.5px/1.25 var(--font);grid-column:1}
.wk .wc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.wk .wn{grid-row:1/3;grid-column:2;font:700 13px var(--mono);color:var(--muted)}
.wk .body{padding:0 16px 14px;display:grid;gap:12px}
.wk.cur{border-color:var(--signal);box-shadow:inset 3px 0 0 var(--signal)}

.dec{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:14px;padding:14px 16px;display:grid;gap:8px;cursor:pointer}
.dec.done{border-left-color:var(--good)}
.dec .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dec .when{font:700 17px var(--mono)}
.dec h3{font:800 16.5px/1.25 var(--font)}
.pick{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:center;font-size:14.5px;color:var(--ink2)}
.pick b{color:var(--ink);font-weight:700}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:7px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg.scroller,.scroller{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.scroller::-webkit-scrollbar{display:none}
.scroller button{flex:none}

.ctl{display:grid;grid-template-columns:1fr auto;gap:0 12px;align-items:baseline}
.ctl label{font-weight:600;font-size:14.5px}
.ctl output{font:700 14.5px var(--mono);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;margin:8px 0 2px;accent-color:var(--sea);height:28px}
.ctl small{grid-column:1/-1;font-size:12.5px;color:var(--muted);line-height:1.35}
.tick{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14.5px;cursor:pointer}
.tick input{width:22px;height:22px;margin:0;accent-color:var(--sea)}

.head{position:sticky;top:calc(var(--top) + 63px);z-index:10;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;box-shadow:0 8px 16px -12px rgba(0,0,0,.6)}
.head .k{font:600 13px var(--font);opacity:.85}
.head .v{font:700 20px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.read{display:grid;gap:14px}
.stat{display:grid;gap:2px}
.stat .k{font:700 11px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.stat .v{font:700 24px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:19px}
.stat .n{font-size:14px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>*{min-width:0}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none;min-height:44px}
.verdict{font-weight:700;font-size:15.5px;line-height:1.4}
.bar .t{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;margin-bottom:4px}
.bar .t b{font:700 14px var(--mono)}
.hbar{height:16px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hbar.b2{background:var(--s2)}
.rng{position:relative;height:12px;background:var(--inset);border-radius:2px;margin:6px 0}
.rng i{position:absolute;top:0;bottom:0;background:var(--s1);border-radius:4px;min-width:4px}
.lst{display:grid}
.lst>div{padding:12px 0;border-bottom:1px solid var(--line)}
.lst>div:last-child{border-bottom:0}
.lst .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lst .h b{font-weight:800}
.lst p{font-size:14px;color:var(--ink2);margin-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2);font-weight:600}
.key{display:inline-block;width:16px;border-top:2.5px solid var(--s1);vertical-align:middle;margin-right:6px}
.key.k2{border-top-color:var(--s2)}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.grid{stroke:var(--line);stroke-width:1}
.ax{font:500 10.5px var(--mono);fill:var(--muted)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln1{stroke:var(--s1)}.ln2{stroke:var(--s2)}
.dot{stroke:var(--surface);stroke-width:2}
.cross{stroke:var(--ink2);stroke-width:1}
.readout{font:600 13.5px var(--font);color:var(--ink2);min-height:20px}
table.tb{width:100%;border-collapse:collapse;font:500 13.5px var(--mono);font-variant-numeric:tabular-nums}
.tb th,.tb td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
.tb th{font:700 11px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.tb th:first-child,.tb td:first-child{text-align:left}

.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.note.talk{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.note .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.note .meta b{color:var(--ink);font-size:14px}
.note .txt{font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .ctx{font-size:13px;font-weight:700;color:var(--sea);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.note .acts{display:flex;gap:16px;flex-wrap:wrap}
textarea,input[type=text],input[type=date],select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical;line-height:1.4}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:14.5px}

.radio{display:grid;gap:8px}
.radio label{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-weight:600;font-size:15px}
.radio input{width:20px;height:20px;margin:0;accent-color:var(--sea)}
.radio label:has(input:checked){border-color:var(--sea);background:var(--roy-bg)}
.radio .who{margin-left:auto;display:flex;gap:4px}

.guide{display:grid}
.guide button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 2px;background:none;border:0;border-bottom:1px solid var(--line);font-weight:600;font-size:15.5px;text-align:left;cursor:pointer}
.guide button:last-child{border-bottom:0}
.guide button::after{content:"›";font-size:22px;color:var(--muted);line-height:1}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--bot)}
.tabs nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:680px}
.tabs a{display:grid;justify-items:center;gap:3px;padding:8px 0 9px;text-decoration:none;color:var(--muted);font:700 11px var(--font);position:relative}
.tabs a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
.tabs a .dotb{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--signal)}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,15,19,.45);display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:8px 16px calc(24px + var(--bot));display:none;max-width:680px;margin:0 auto;overscroll-behavior:contain}
.sheet.open,.scrim.open{display:block}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .sh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet .sh h2{font:800 20px/1.2 var(--font)}
.sheet .x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--inset);font-size:20px;line-height:1;cursor:pointer}
.sheet .stack>.card{padding:14px}

.toast{position:fixed;left:50%;bottom:calc(84px + var(--bot));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14.5px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1;pointer-events:auto}

.splash{min-height:100%;display:grid;place-items:center;padding:calc(var(--top) + 24px) 20px calc(var(--bot) + 24px)}
.splash .in{max-width:420px;width:100%;display:grid;gap:16px}
.splash h1{font:900 34px/1.05 var(--font);letter-spacing:-.02em}
.splash h1 span{color:var(--signal);font-weight:400}
.whobtn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:800 18px var(--font);cursor:pointer}
.whobtn .av{width:40px;height:40px;font-size:17px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filepick" accept=".json,.txt,application/json,text/plain" hidden>

<script>
"use strict";
/*PURE-START*/
const DAY=864e5;
function iso(s){const p=String(s).split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function pmt(loan,ratePct,years){const r=ratePct/1200,n=years*12;return r?loan*r/(1-Math.pow(1+r,-n)):loan/n;}
function saleNet(price,payoff,pct){return price*(1-pct/100)-payoff;}
function balAfter(loan,ratePct,pay,months){let b=loan;const r=ratePct/1200;for(let i=0;i<months&&b>0;i++)b=b*(1+r)-pay;return Math.max(0,b);}
function keepVsSell(p){
  const net=saleNet(p.price,p.payoff,p.sellPct),N=p.years;
  const sellWealth=net*Math.pow(1+p.yld/100,N);
  const collected=p.utRent*(1-p.vacPct/100);
  const cash=collected*(1-p.mgmtPct/100)-p.maint-p.utCarry;
  const value=p.price*Math.pow(1+p.appr/100,N);
  const bal=balAfter(p.payoff,p.utRate,p.utPI,N*12);
  const proceeds=value*(1-p.sellPct/100);
  const recapture=p.utRent>0?p.recapYr*N:0;
  const cgTax=N>3?Math.max(0,proceeds-p.basis)*0.24:0;
  const keepWealth=proceeds-bal+cash*12*N-recapture-cgTax;
  return {net,sellMonthly:net*p.yld/1200,sellWealth,cash,value,bal,recapture,cgTax,keepWealth,diff:keepWealth-sellWealth};
}
function buyMonthly(p){
  const loan=Math.max(0,p.bPrice-p.bDown),pi=pmt(loan,p.bRate,30),tax=p.bPrice*p.bTax/1200,ins=p.bIns;
  const lowDown=p.bDown/p.bPrice<0.2,pmi=lowDown?loan*0.005/12:0;
  return {loan,pi,tax,ins,pmi,total:pi+tax+ins+pmi,lowDown,jumbo:loan>1249125,downPct:p.bDown/p.bPrice*100};
}
function rentVsBuy(p,years){
  years=years||15;
  const loan=Math.max(0,p.bPrice-p.bDown),r=p.bRate/1200,pi=pmt(loan,p.bRate,30);
  const im=Math.pow(1+p.bInv/100,1/12)-1,am=Math.pow(1+p.bAppr/100,1/12);
  const lowDown=p.bDown/p.bPrice<0.2,sellCost=0.06,closing=p.bPrice*0.015;
  let bal=loan,value=p.bPrice,sideB=0,sideR=p.bDown+closing;
  const buy=[p.bPrice*(1-sellCost)-loan],rent=[sideR];
  for(let m=0;m<years*12;m++){
    const yr=Math.floor(m/12);
    const cb=pi+p.bPrice*p.bTax/1200*Math.pow(1.02,yr)+p.bIns*Math.pow(1.03,yr)+value*p.bMaint/1200+(lowDown&&bal>0.8*p.bPrice?bal*0.005/12:0);
    const cr=p.leaseRent*Math.pow(1+p.rentG/100,yr)+25;
    sideB*=1+im;sideR*=1+im;
    if(cb>cr)sideR+=cb-cr;else sideB+=cr-cb;
    bal=Math.max(0,bal*(1+r)-pi);value*=am;
    if(m%12===11){buy.push(value*(1-sellCost)-bal+sideB);rent.push(sideR);}
  }
  let even=null;for(let y=1;y<=years;y++){if(buy[y]>=rent[y]){even=y;break;}}
  return {buy,rent,even};
}
function moveCosts(MOVE,size,months,labor){
  const unit=[330*months,600*months],sum=a=>a.reduce((t,x)=>[t[0]+x[1],t[1]+x[2]],[0,0]);
  const rows=[];
  let parts=[["Movers, door to door",MOVE.full[size][0],MOVE.full[size][1]],["SFMTA truck signs",355,355]];
  if(months>0)parts.push(["Bay Area storage unit",unit[0],unit[1]],["Local delivery out of storage",300,1800]);
  rows.push({id:"full",name:"Full-service movers",parts,note:(months>0?"Handled three times: house, storage unit, new home.":"Handled once, door to door.")+" The truck stays only while the crew loads. Confirm that with the HOA."});
  let n=MOVE.cubes[size];

function mergeInto(L,inc){

  if(inc.plan&&inc.plan.kind===APP_ID&&(!L.plan||String(inc.plan.version)>String(L.plan.version))){L.plan=inc.plan;rep.plan=true;}
  for(const key of ["notes","scenarios"]){

    for(const x of inc[key]||[]){const cur=m.get(x.id);if(!cur||stamp(x)>stamp(cur)){m.set(x.id,x);rep[key]++;}}

    const x=inc.picks[d][who];L.picks[d]=L.picks[d]||{};const cur=L.picks[d][who];
    if(!cur||(x.at||0)>(cur.at||0)){L.picks[d][who]=x;rep.picks++;}
  }
  L.kv=L.kv||{};
  for(const k in inc.kv||{}){const x=inc.kv[k],cur=L.kv[k];if(!cur||(x.at||0)>(cur.at||0)){L.kv[k]=x;rep.kv++;}}

function cleanImport(o,people){
  const okWho=w=>people.includes(w);
  const str=(s,n)=>typeof s==="string"?s.slice(0,n):"";
  const out={from:okWho(o.from)?o.from:null,exportedAt:str(o.exportedAt,40),plan:null,notes:[],scenarios:[],picks:{},kv:{}};
  if(o.plan&&o.plan.kind===APP_ID&&Array.isArray(o.plan.weeks))out.plan=o.plan;
  for(const n of Array.isArray(o.notes)?o.notes:[]){
    if(!n||typeof n.id!=="string"||!okWho(n.by))continue;
    out.notes.push({id:str(n.id,64),by:n.by,at:+n.at||0,upd:+n.upd||+n.at||0,text:str(n.text,6000),tag:str(n.tag,24),ctx:str(n.ctx,80),ctxLabel:str(n.ctxLabel,120),talk:!!n.talk,resolved:!!n.resolved,del:!!n.del});
  }
  for(const s of Array.isArray(o.scenarios)?o.scenarios:[]){
    if(!s||typeof s.id!=="string"||!okWho(s.by))continue;
    const values={};for(const k in (s.values&&typeof s.values==="object")?s.values:{}){const v=s.values[k];if(["number","string","boolean"].includes(typeof v))values[str(k,24)]=v;}
    out.scenarios.push({id:str(s.id,64),by:s.by,at:+s.at||0,upd:+s.upd||+s.at||0,calc:str(s.calc,24),name:str(s.name,120),comment:str(s.comment,4000),values,summary:(Array.isArray(s.summary)?s.summary:[]).map(x=>str(x,300)).slice(0,8),del:!!s.del});
  }
  if(o.picks&&typeof o.picks==="object")for(const d in o.picks){
    const p=o.picks[d];if(!p||typeof p!=="object")continue;
    for(const who in p){if(!okWho(who))continue;const x=p[who]||{};
      out.picks[str(d,24)]=out.picks[str(d,24)]||{};
      out.picks[str(d,24)][who]={choice:Number.isInteger(x.choice)?x.choice:null,sure:Number.isInteger(x.sure)?x.sure:null,note:str(x.note,4000),at:+x.at||0};}
  }
  if(o.kv&&typeof o.kv==="object")for(const k in o.kv){
    const x=o.kv[k];if(!x||typeof x!=="object")continue;const v=x.v;
    if(v!==null&&!["number","string","boolean"].includes(typeof v)&&!(v&&typeof v==="object"))continue;
    out.kv[str(k,64)]={v:v&&typeof v==="object"?JSON.parse(JSON.stringify(v)):v,at:+x.at||0,by:okWho(x.by)?x.by:null};
  }
  return out;
}
function readImport(text,people){
  let o;try{o=JSON.parse(String(text).trim());}catch(e){return {ok:false,error:"That isn't a file from the Move Plan app. Check you picked the right one."};}
  if(o&&o.kind===APP_ID)return {ok:true,data:cleanImport({plan:o},people)};
  if(!o||o.app!==APP_ID)return {ok:false,error:"That file isn't from the Move Plan app."};
  if(o.format>FORMAT)return {ok:false,error:"That file comes from a newer version of the app. Reload the app while online, then try again."};
  return {ok:true,data:cleanImport(o,people)};
}
function makeExport(S){

    readme:"Changes from the Move Plan app. Open the app, tap the share button at the top, then Bring in changes. Claude can read this file too.",

function unsentCount(S){
  const t=S.lastExport||0,me=S.me;let n=0;
  for(const x of S.notes)if(x.by===me&&stamp(x)>t)n++;
  for(const x of S.scenarios)if(x.by===me&&stamp(x)>t)n++;
  for(const d in S.picks){const x=S.picks[d][me];if(x&&x.at>t)n++;}
  for(const k in S.kv){const x=S.kv[k];if(x.by===me&&x.at>t)n++;}
  return n;
}

function drawChart(res){
  const box=$("#chart");if(!box)return;
  const W0=Math.max(280,box.clientWidth||340),H=220,m={l:50,r:10,t:10,b:26};
  const all=res.buy.concat(res.rent),lo=Math.min(0,...all),hi=Math.max(...all);
  const raw=(hi-lo)/4,p10=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p10,step=(f<1.5?1:f<3?2:f<7?5:10)*p10;
  const y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step;
  const x=i=>m.l+(W0-m.l-m.r)*i/15,y=v=>H-m.b-(H-m.t-m.b)*(v-y0)/(y1-y0);
  let s='<svg viewBox="0 0 '+W0+" "+H+'" role="img" aria-label="Rent and invest against buy, by year">';
  for(let v=y0;v<=y1+1;v+=step)s+='<line class="grid" x1="'+m.l+'" x2="'+(W0-m.r)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ax" x="'+(m.l-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+K(v)+"</text>";
  [0,5,10,15].forEach(i=>{s+='<text class="ax" x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+(i===15?"end":i===0?"start":"middle")+'">'+(i?"Yr "+i:"Now")+"</text>";});
  const path=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  s+='<line class="cross" id="cross" x1="0" x2="0" y1="'+m.t+'" y2="'+(H-m.b)+'" visibility="hidden"/><path class="ln ln1" d="'+path(res.rent)+'"/><path class="ln ln2" d="'+path(res.buy)+'"/>';
  s+='<circle class="dot" style="fill:var(--s1)" cx="'+x(15).toFixed(1)+'" cy="'+y(res.rent[15]).toFixed(1)+'" r="5"/><circle class="dot" style="fill:var(--s2)" cx="'+x(15).toFixed(1)+'" cy="'+y(res.buy[15]).toFixed(1)+'" r="5"/></svg>';
  box.innerHTML=s;
  const svg=box.firstChild,cross=svg.querySelector("#cross");
  const mv=ev=>{const rc=svg.getBoundingClientRect(),sx=(ev.clientX-rc.left)*W0/rc.width,i=Math.max(0,Math.min(15,Math.round((sx-m.l)/(W0-m.l-m.r)*15)));
    cross.setAttribute("x1",x(i));cross.setAttribute("x2",x(i));cross.setAttribute("visibility","visible");
    const d=res.buy[i]-res.rent[i];$("#readout").textContent=(i?"Year "+i:"Today")+": rent and invest "+usd(res.rent[i])+", buy "+usd(res.buy[i])+". "+(d>=0?"Buying":"Renting")+" ahead by "+usd(Math.abs(d))+".";};
  svg.addEventListener("pointermove",mv);svg.addEventListener("pointerdown",mv);
}

    case"ntag":b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));b.closest(".stack").querySelector('[data-act="savenote"]').dataset.tag=b.dataset.v;break;
    case"savenote":{const inSheet=!!b.closest("#sheet");if(saveNote(b)){if(inSheet)closeSheet();else render();}break;}
    case"delnote":{const n=st.notes.find(x=>x.id===b.dataset.id);if(n){n.del=true;n.text="";n.upd=now();save();if($("#sheet").classList.contains("open"))closeSheet();else render();toast("Note deleted.");}break;}
    case"resolve":{const n=st.notes.find(x=>x.id===b.dataset.id);if(n){n.resolved=!n.resolved;n.upd=now();save();if($("#sheet").classList.contains("open"))closeSheet();else render();}break;}
    case"goctx":if($("#sheet").classList.contains("open")){$("#sheet").classList.remove("open");$("#scrim").classList.remove("open");}goCtx(b.dataset.ctx);break;
    case"nfilter":st.ui.noteFilter=b.dataset.v;save();render();break;
    case"guide":openGuide(b.dataset.id);break;
    case"calc":st.ui.calc=b.dataset.v;save();render();break;
    case"seg":st.work[b.dataset.k]=b.dataset.v;if(b.dataset.k==="tenant")Object.assign(st.work,P().tenant[b.dataset.v]);save();render();break;
    case"item":{const it=P().items[b.dataset.v];Object.assign(st.work,{wItem:b.dataset.v,wCuft:it[1],wReplace:it[2],wResale:it[3]});save();render();break;}
    case"preset":{const w=W();st.work.bDown=b.dataset.v==="sale"?Math.max(100000,Math.round(saleNet(w.price,w.payoff,w.sellPct)/1000)*1000):b.dataset.v==="20"?Math.round(w.bPrice*0.2/1000)*1000:450000;save();render();break;}
    case"bud":kvSet("bud:"+b.dataset.i,b.dataset.v);updCalc();break;
    case"resetcalc":{const c=calcs().find(x=>x.id===st.ui.calc);c.keys.forEach(k=>delete st.work[k]);save();render();toast("Back to the plan's numbers.");break;}
    case"savescn":saveScenarioSheet();break;
    case"confirmscn":confirmScenario();break;
    case"openscn":openScenario(b.dataset.id);break;
    case"loadscn":{const s=st.scenarios.find(x=>x.id===b.dataset.id);if(s){for(const k in s.values){if(k.startsWith("bud"))continue;st.work[k]=s.values[k];}save();closeSheet();toast("Loaded "+(s.by===st.me?"your":s.by+"'s")+" numbers.");}break;}
    case"delscn":{const s=st.scenarios.find(x=>x.id===b.dataset.id);if(s){s.del=true;s.upd=now();save();closeSheet();toast("Scenario deleted.");}break;}
  }
});
document.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.act;
  if(a==="tick"){kvSet("done:"+t.dataset.id,t.checked);}
  else if(a==="qtick"){kvSet("q:"+t.dataset.id,t.checked);updCalc();}
  else if(a==="pick"){const id=t.dataset.id,p=(st.picks[id]=st.picks[id]||{})[st.me]||{};p.choice=+t.dataset.i;p.at=now();st.picks[id][st.me]=p;save();refreshBadge();openDecision(id);}
  else if(a==="flag"){st.work[t.dataset.k]=t.checked;save();updCalc();}
  else if(a==="date"&&t.value){kvSet("date:"+t.dataset.k,t.value);render();}
  else if(t.id==="filepick"&&t.files&&t.files[0]){t.files[0].text().then(doImport).catch(()=>toast("Couldn't read that file."));}
});
let pnT;
document.addEventListener("input",e=>{
  const t=e.target,a=t.dataset.act;
  if(a==="slide"){const k=t.dataset.k;st.work[k]=+t.value;const c=P().controls[k];const o=document.getElementById("o-"+k);if(o)o.textContent=FMT[c[4]](+t.value);updCalc();clearTimeout(pnT);pnT=setTimeout(save,250);}
  else if(a==="picknote"){const id=t.dataset.id,p=(st.picks[id]=st.picks[id]||{})[st.me]||{};p.note=t.value.slice(0,4000);p.at=now();st.picks[id][st.me]=p;clearTimeout(pnT);pnT=setTimeout(()=>{save();refreshBadge();},400);}
});
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("open"))closeSheet();});
window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)){st.ui.tab=t;save();}render();});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;});
let rT;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{if(st.ui.tab==="numbers"&&st.ui.calc==="buy")updCalc();},150);});

function openGuide(id){
  const g=P().guide.find(x=>x.id===id);if(!g)return;
  let h='<div class="stack">';
  if(g.groups)h+=g.groups.map(gr=>'<div class="card"><h2>'+esc(gr.name)+'</h2><div class="lst">'+gr.items.map(it=>"<div><b>"+(it[2]&&/^https:\/\//.test(it[2])?'<a href="'+esc(it[2])+'" target="_blank" rel="noopener">'+esc(it[0])+"</a>":esc(it[0]))+"</b><p>"+esc(it[1])+"</p></div>").join("")+"</div></div>").join("");
  if(g.list)h+='<div class="card"><ol style="margin:0;padding-left:20px;display:grid;gap:10px">'+g.list.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol></div>";
  if(g.checklist)h+='<div class="card">'+(g.note?'<p class="sub" style="margin-bottom:6px">'+esc(g.note)+"</p>":"")+'<ul class="checks">'+g.checklist.map(c=>todoLi({id:c[0],text:c[1]})).join("")+"</ul></div>";
  h+='<div class="row"><button class="btn sm" type="button" data-act="addnote" data-ctx="guide:'+esc(id)+'" data-label="'+esc(g.title)+'" data-tag="ask">Add a note</button></div>';
  const ns=notesLive().filter(n=>n.ctx==="guide:"+id);if(ns.length)h+=ns.map(noteHtml).join("");
  openSheet(g.title,h+"</div>");
}

/* ---------- start ---------- */
async function start(){
  syncPeople();
  const q=new URLSearchParams(location.search),as=q.get("as");
  if(!st.me&&PEOPLE.includes(as))st.me=as;
  const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t))st.ui.tab=t;
  render();
  try{
    const r=await fetch("plan.json",{cache:"no-cache"});
    if(r.ok){const p=await r.json();if(p&&p.kind===APP_ID&&(!st.plan||String(p.version)>String(st.plan.version))){const had=!!st.plan;st.plan=p;syncPeople();save();render();if(had)toast("Plan updated to "+p.version+".");}}
  }catch(e){}
  if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
}
start();
</script>
